<svg viewBox="0 0 190 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emeraldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="amberGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="slateGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="softShadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Icon Symbol: Location Pin Badge with Checkmark & Accent Dot -->
  <g filter="url(#softShadowLight)">
    <!-- Pin Base Shell -->
    <path d="M22 6 C12.059 6 4 14.059 4 24 C4 35.5 22 47 22 47 C22 47 40 35.5 40 24 C40 14.059 31.941 6 22 6 Z" fill="url(#emeraldGradLight)" />
    <!-- Inner Shield/Circle cutout -->
    <circle cx="22" cy="22" r="10" fill="#FFFFFF" />
    <!-- Checkmark inside -->
    <path d="M16 22 L20 26 L28 17" stroke="url(#emeraldGradLight)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Floating Amber Accent Dot -->
    <circle cx="36" cy="10" r="4.5" fill="url(#amberGradLight)" stroke="#FFFFFF" stroke-width="1.5" />
  </g>
  
  <!-- Brand Name Typography -->
  <!-- "find" in Elegant Deep Slate Serif -->
  <text x="48" y="31" fill="url(#slateGradLight)" font-size="25" font-weight="900" font-family="'Playfair Display', Georgia, serif" letter-spacing="-0.5">
    find
  </text>
  
  <!-- "Me" in Emerald Gradient -->
  <text x="96" y="31" fill="url(#emeraldGradLight)" font-size="27" font-weight="900" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" letter-spacing="-0.5">
    Me
  </text>
  
  <!-- Tagline: ADRESSAGE CERTIFIÉ -->
  <text x="49" y="44" fill="#64748B" font-size="7" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2.2">
    ADRESSAGE CERTIFIÉ
  </text>
</svg>
