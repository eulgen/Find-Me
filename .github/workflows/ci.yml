name: Frontend CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci